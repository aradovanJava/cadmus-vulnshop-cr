name: build-and-scan

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read          # keep this minimal; widen only with justification

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # TODO(CR4): pin by commit SHA
      - uses: actions/setup-java@v4        # TODO(CR4): pin by commit SHA
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B clean verify

