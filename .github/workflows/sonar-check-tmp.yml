name: sonar-check-tmp
on:
  push:
    branches: [ ci/smoke-test-tmp ]
permissions:
  contents: read
jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      sonarqube:
        image: sonarqube:community
        ports: [ '9000:9000' ]
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25', cache: maven }
      - name: Wait for SonarQube
        run: |
          for i in $(seq 1 120); do s=$(curl -s http://localhost:9000/api/system/status || true); case "$s" in *'"UP"'*) echo "$s"; break;; esac; sleep 5; done
          curl -s http://localhost:9000/api/server/version; echo
      - name: Throwaway token (CI container only)
        run: |
          curl -s -o /dev/null -w 'change_password %{http_code}\n' -u admin:admin -X POST http://localhost:9000/api/users/change_password -d login=admin -d previousPassword=admin -d 'password=Ci-Only-Passw0rd!x9'
          T=$(curl -s -u 'admin:Ci-Only-Passw0rd!x9' -X POST http://localhost:9000/api/user_tokens/generate -d name=ci -d type=GLOBAL_ANALYSIS_TOKEN | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$T"; echo "SONAR_TOKEN=$T" >> "$GITHUB_ENV"
      - name: Exactly what tools\scan-sonar.ps1 runs
        run: |
          mvn -B -q -DskipTests clean compile
          mvn -B sonar:sonar "-Dsonar.host.url=http://localhost:9000" "-Dsonar.token=$SONAR_TOKEN" 2>&1 | grep -E "sonar-maven-plugin|Project key|ANALYSIS SUCCESSFUL|BUILD|ERROR|Indexing files|files indexed|Sensor HTML|projectKey" | head -30
      - name: What SonarQube shows
        run: |
          sleep 20
          echo "--- projects"; curl -s -u "$SONAR_TOKEN:" "http://localhost:9000/api/projects/search" | python3 -c 'import sys,json; [print(c["key"], "|", c["name"]) for c in json.load(sys.stdin)["components"]]' || true
          for k in cadmus-vulnshop-cr eu.cadmus:vulnshop-cr; do
            echo "--- $k: html files"; curl -s -u "$SONAR_TOKEN:" "http://localhost:9000/api/components/tree?component=$k&qualifiers=FIL&ps=500" | python3 -c 'import sys,json; d=json.load(sys.stdin); f=[c["path"] for c in d.get("components",[])]; print(len(f), "files;", [x for x in f if x.endswith(".html")])' || true
            echo "--- $k: security issues"; curl -s -u "$SONAR_TOKEN:" "http://localhost:9000/api/issues/search?componentKeys=$k&impactSoftwareQualities=SECURITY&ps=100" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("total")); [print("  ", i["rule"], i["component"].split(":")[-1], i.get("line")) for i in d.get("issues",[])]' || true
            echo "--- $k: hotspots"; curl -s -u "$SONAR_TOKEN:" "http://localhost:9000/api/hotspots/search?projectKey=$k&ps=100" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("paging",{}).get("total")); [print("  ", h["ruleKey"], h["component"].split(":")[-1], h.get("line")) for h in d.get("hotspots",[])]' || true
          done
