# CADMUS-CR-14 · CR1
#
# Scanner configuration for the vulnerable application.
#
# Note what is NOT set here: there is no exclusion for test sources, no
# suppression file and no new-code reference branch. Those are deliberate
# omissions - CR1 asks you to notice their consequences, and N4 explains what
# each of them would change.

sonar.projectKey=cadmus-vulnshop-cr
sonar.projectName=CADMUS VulnShop (CR1)
sonar.projectVersion=1.0.0-TRAINING

sonar.sources=src/main
sonar.tests=src/test
sonar.java.binaries=target/classes
sonar.sourceEncoding=UTF-8

# Templates are part of the attack surface. If this line is removed, three of
# the injected weaknesses stop being reported at all.
sonar.inclusions=**/*.java,**/*.html,**/*.yml,**/*.xml,**/*.sql

sonar.host.url=http://localhost:9000
