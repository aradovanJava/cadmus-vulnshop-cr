<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Order placed')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<main>
    <div class="card">
        <h1>Order placed</h1>
        <table>
            <tr><th>Order number</th><td th:text="${order.id}">1000</td></tr>
            <tr><th>Product</th><td th:text="${order.productName}">product</td></tr>
            <tr><th>Quantity</th><td th:text="${order.quantity}">1</td></tr>
            <tr><th>Unit price</th><td th:text="'EUR ' + ${order.unitPrice}">0.00</td></tr>
            <tr><th>Total charged</th><td th:text="'EUR ' + ${order.total}">0.00</td></tr>
        </table>
        <p><a th:href="@{/account/orders}">Back to my orders</a></p>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
